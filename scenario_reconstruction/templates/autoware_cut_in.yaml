template_id: autoware_cut_in_run01
description: >
  Hand-authored two-lane highway cut-in demonstration, NOT verified Autoware accident reconstruction.
  The actor starts in the right lane ahead of the CAV and is forced to merge
  left while the CAV continues with IDM control.
map: 2Lane
route: route_0
duration: 12.0
tags:
  - synthetic_demo
  - cut_in
  - two_lane_highway

ego:
  id: CAV
  role: CAV
  route: route_0
  lane_index: 1
  position: 400.0
  speed: 34.8
  controller: IDM

actors:
  - id: BV_cut_in
    role: BV
    route: route_0
    lane_index: 0
    position: 418.0
    speed: 24.5
    controller: script
  - id: BV_right_follower
    role: BV
    route: route_0
    lane_index: 0
    position: 388.0
    speed: 23.5
    controller: IDM

events:
  - type: forced_bv_action
    actor: BV_cut_in
    start_time: 0.0
    duration: 0.8
    params:
      lateral: left
      longitudinal: 0.0
      apply_once: false

perturbations:
  - field: ego.speed
    distribution: uniform
    low: -2.0
    high: 2.0
  - field: actors.BV_cut_in.position
    distribution: uniform
    low: -5.0
    high: 5.0
  - field: actors.BV_cut_in.speed
    distribution: uniform
    low: -2.0
    high: 2.0
  - field: actors.BV_right_follower.position
    distribution: uniform
    low: -6.0
    high: 4.0
  - field: actors.BV_right_follower.speed
    distribution: uniform
    low: -2.0
    high: 2.0
  - field: events.forced_bv_action.start_time
    distribution: uniform
    low: 0.0
    high: 1.0
